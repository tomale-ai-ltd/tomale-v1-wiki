<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Approvals inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Bold.woff2") format("woff2");font-weight:700}
body{margin:0}
a{color:#1b7b7a}a:hover{color:#145e5d}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f8f8f8; color: #2b1f1c; font-family: 'Glacial Indifference', 'Avenir Next', system-ui, sans-serif">

<header style="box-sizing: border-box; padding: 54px 16px 20px; background: #39c2c1; border-radius: 0 0 32px 32px; position: relative; overflow: hidden">
<svg viewBox="0 0 390 130" width="390" height="130" style="position: absolute; left: 0; top: 0" aria-hidden="true"><circle cx="340" cy="30" r="64" fill="#5fd0cf"/><circle cx="260" cy="100" r="4" fill="#fcca37"/></svg>
<div style="position: relative; display: flex; align-items: center; gap: 12px">
<a href="Main.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center; flex: none">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#2b1f1c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<h1 style="margin: 0; font-size: 32px; line-height: 38px; font-weight: 700">Approvals</h1>
</div>
</header>

<main style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 16px">
<div role="tablist" aria-label="Approvals" style="display: flex; padding: 4px; border-radius: 999px; background: #f1ebe8">
<button type="button" role="tab" aria-selected="{{reviewSel}}" style="{{reviewTab}}">To review ({{reviewCount}})</button>
<button type="button" role="tab" aria-selected="{{rejectedSel}}" style="{{rejectedTab}}">Rejected (1)</button>
</div>

<sc-if value="{{showList}}" hint-placeholder-val="{{ true }}">
<div style="background: #ffffff; border-radius: 16px; box-shadow: 0 2px 8px rgba(43,31,28,0.08); overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
<a href="{{r.href}}" style="min-height: 88px; box-sizing: border-box; padding: 12px 16px; display: flex; align-items: center; gap: 14px; text-decoration: none; color: #2b1f1c; border-bottom: 1px solid #f1ebe8">
<span style="width: 56px; height: 56px; border-radius: 10px; overflow: hidden; display: block; flex: none; background: #f1ebe8">
<sc-if value="{{r.isPending}}" hint-placeholder-val="{{ false }}"><dc-import name="Art" kind="pending" hint-size="56px,56px"></dc-import></sc-if>
<sc-if value="{{r.isFox}}" hint-placeholder-val="{{ false }}"><dc-import name="Art" kind="fox" hint-size="56px,56px"></dc-import></sc-if>
<sc-if value="{{r.isRobot}}" hint-placeholder-val="{{ false }}"><dc-import name="Art" kind="robot" hint-size="56px,56px"></dc-import></sc-if>
</span>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 18px; line-height: 24px; font-weight: 700">{{r.title}}</span>
<span style="font-size: 14px; line-height: 20px; color: #6e5c57">{{r.meta}}</span>
<sc-if value="{{r.making}}" hint-placeholder-val="{{ false }}">
<span style="align-self: flex-start; margin-top: 2px; padding: 2px 10px; border-radius: 999px; background: #d7f3f2; font-size: 13px; line-height: 18px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase">Still being made</span>
</sc-if>
</span>
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#6e5c57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
</a>
</sc-for>
</div>
<sc-if value="{{isRejectedTab}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #6e5c57">Children can't see these. Approve one for the child, keep it for yourself, or delete it.</p>
</sc-if>
</sc-if>

<sc-if value="{{showEmpty}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 32px 16px; text-align: center">
<svg viewBox="0 0 120 120" width="112" height="112" aria-hidden="true"><circle cx="60" cy="60" r="56" fill="#d7f3f2"/><path d="M36 62 L52 78 L86 44" fill="none" stroke="#1b7b7a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
<h2 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 700">{{emptyTitle}}</h2>
<p style="margin: 0; font-size: 16px; line-height: 22px; color: #6e5c57">{{emptyBody}}</p>
</div>
</sc-if>
</main>

<sc-if value="{{showToast}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 40px; box-sizing: border-box; padding: 14px 16px; border-radius: 16px; background: #2b1f1c; color: #ffffff; display: flex; align-items: center; gap: 10px; box-shadow: 0 -8px 24px rgba(43,31,28,0.12); font-size: 16px; line-height: 22px; font-weight: 700">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#9fe0df" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 6 9 17l-5-5"/></svg>
{{toastText}}</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tab":{"editor":"enum","options":["review","rejected"],"default":"review"},"empty":{"editor":"boolean","default":false},"toast":{"editor":"enum","options":["none","approved","approved-not-ready","rejected"],"default":"none"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rej = (this.props.tab ?? 'review') === 'rejected';
    const empty = this.props.empty === true;
    const t = this.props.toast ?? 'none';
    const tab = (on) => 'flex: 1 1 0; height: 44px; border-radius: 999px; border: 0; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; background: ' + (on ? '#ffffff' : 'transparent') + '; color: ' + (on ? '#2b1f1c' : '#6e5c57') + (on ? '; box-shadow: 0 2px 8px rgba(43,31,28,0.08)' : '');
    const review = [
      { title: 'The Big Storm', meta: "Mia's story · today", making: true, isPending: true, href: 'Review.dc.html' },
      { title: 'Rosie and the Lost Puppy', meta: "Leo's story · yesterday", making: false, isFox: true, href: 'Review.dc.html' }
    ];
    const rejected = [
      { title: 'The Haunted Castle', meta: "Leo's story · rejected 2 days ago", making: false, isRobot: true, href: 'RejectedActions.dc.html' }
    ];
    return {
      reviewSel: rej ? 'false' : 'true', rejectedSel: rej ? 'true' : 'false',
      reviewTab: tab(!rej), rejectedTab: tab(rej),
      reviewCount: empty && !rej ? '0' : '2',
      isRejectedTab: rej,
      showList: !empty, showEmpty: empty,
      rows: rej ? rejected : review,
      emptyTitle: rej ? 'Nothing rejected' : 'All caught up',
      emptyBody: rej ? "Stories you reject appear here, so you can keep or delete them." : "When a story needs a quick look, it'll appear here and we'll email you.",
      showToast: t !== 'none',
      toastText: t === 'approved' ? 'Approved. Mia can read it now.' : (t === 'approved-not-ready' ? "Approved. Mia can read it once it's ready." : "Rejected. Mia won't see this story.")
    };
  }
}
</script>
</body>
</html>
