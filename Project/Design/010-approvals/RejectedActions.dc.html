<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rejected story actions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Bold.woff2") format("woff2");font-weight:700}
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f8f8f8; color: #2b1f1c; font-family: 'Glacial Indifference', 'Avenir Next', system-ui, sans-serif">
<div aria-hidden="true" style="height: 130px; background: #39c2c1; border-radius: 0 0 32px 32px"></div>
<div aria-hidden="true" style="padding: 20px 16px; display: flex; flex-direction: column; gap: 16px">
<div style="height: 52px; border-radius: 999px; background: #f1ebe8"></div>
<div style="height: 88px; border-radius: 16px; background: #ffffff"></div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(43,31,28,0.4)"></div>

<sc-if value="{{showActions}}" hint-placeholder-val="{{ true }}">
<section role="dialog" aria-modal="true" aria-labelledby="act-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 16px 40px; background: #ffffff; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 24px rgba(43,31,28,0.12); display: flex; flex-direction: column; gap: 14px">
<div aria-hidden="true" style="width: 36px; height: 4px; border-radius: 999px; background: #e6dedb; margin: 0 auto"></div>
<div style="display: flex; align-items: center; gap: 14px; padding: 0 8px">
<span style="width: 56px; height: 56px; border-radius: 10px; overflow: hidden; display: block; flex: none"><dc-import name="Art" kind="robot" hint-size="56px,56px"></dc-import></span>
<div>
<h2 id="act-title" style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">The Haunted Castle</h2>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #6e5c57">Leo's story · rejected 2 days ago</p>
</div>
</div>
<nav aria-label="Story actions" style="display: flex; flex-direction: column">
<button type="button" style="min-height: 64px; box-sizing: border-box; padding: 8px; border: 0; border-bottom: 1px solid #f1ebe8; background: transparent; font: inherit; color: #2b1f1c; text-align: left; display: flex; align-items: center; gap: 14px; cursor: pointer">
<span style="width: 40px; height: 40px; border-radius: 999px; background: #d7f3f2; display: flex; align-items: center; justify-content: center; flex: none"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#1b7b7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
<span style="display: flex; flex-direction: column"><span style="font-size: 18px; line-height: 24px; font-weight: 700">Approve and keep it for me</span><span style="font-size: 14px; line-height: 20px; color: #6e5c57">It moves to your stories, ready to read or order. Leo won't see it.</span></span></button>
<button type="button" style="min-height: 64px; box-sizing: border-box; padding: 8px; border: 0; border-bottom: 1px solid #f1ebe8; background: transparent; font: inherit; color: #2b1f1c; text-align: left; display: flex; align-items: center; gap: 14px; cursor: pointer">
<span style="width: 40px; height: 40px; border-radius: 999px; background: #d7f3f2; display: flex; align-items: center; justify-content: center; flex: none"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#1b7b7a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
<span style="display: flex; flex-direction: column"><span style="font-size: 18px; line-height: 24px; font-weight: 700">Approve for Leo</span><span style="font-size: 14px; line-height: 20px; color: #6e5c57">Leo can read it after all.</span></span></button>
<a href="#" style="min-height: 64px; box-sizing: border-box; padding: 8px; display: flex; align-items: center; gap: 14px; text-decoration: none; color: #b3261e">
<span style="width: 40px; height: 40px; border-radius: 999px; background: #fde8e6; display: flex; align-items: center; justify-content: center; flex: none"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg></span>
<span style="display: flex; flex-direction: column"><span style="font-size: 18px; line-height: 24px; font-weight: 700">Delete story</span><span style="font-size: 14px; line-height: 20px; color: #6e5c57">Gone for good.</span></span></a>
</nav>
</section>
</sc-if>

<sc-if value="{{showDelete}}" hint-placeholder-val="{{ false }}">
<section role="alertdialog" aria-modal="true" aria-labelledby="del-title" aria-describedby="del-body" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 24px 40px; background: #ffffff; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 24px rgba(43,31,28,0.12); display: flex; flex-direction: column; gap: 16px">
<div aria-hidden="true" style="width: 36px; height: 4px; border-radius: 999px; background: #e6dedb; margin: 0 auto"></div>
<h2 id="del-title" style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 700; text-align: center">Delete "The Haunted Castle"?</h2>
<div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 10px; background: #fde8e6">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
<p id="del-body" style="margin: 0; font-size: 16px; line-height: 22px"><strong>This can't be undone.</strong> The story and its pictures will be deleted.</p>
</div>
<button type="button" style="height: 48px; border-radius: 999px; border: 0; background: #b3261e; color: #ffffff; font: inherit; font-size: 16px; font-weight: 700">Delete story</button>
<button type="button" style="height: 48px; border-radius: 999px; border: 2px solid #8f7f7a; background: #ffffff; color: #2b1f1c; font: inherit; font-size: 16px; font-weight: 700">Keep it</button>
</section>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"enum","options":["actions","confirm-delete"],"default":"actions"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const del = (this.props.step ?? 'actions') === 'confirm-delete';
    return { showActions: !del, showDelete: del };
  }
}
</script>
</body>
</html>
