<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Being made</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Bold.woff2") format("woff2");font-weight:700}
body{margin:0}
a{color:#1b7b7a}a:hover{color:#145e5d}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #39c2c1; color: #2b1f1c; font-family: 'Glacial Indifference', 'Avenir Next', system-ui, sans-serif; display: flex; flex-direction: column">
<svg viewBox="0 0 390 844" width="390" height="844" style="position: absolute; left: 0; top: 0" aria-hidden="true"><circle cx="330" cy="120" r="110" fill="#5fd0cf"/><circle cx="40" cy="620" r="90" fill="#5fd0cf"/><circle cx="90" cy="200" r="6" fill="#fcca37"/><circle cx="300" cy="560" r="5" fill="#ffffff"/><circle cx="250" cy="250" r="4" fill="#ffffff"/></svg>

<div style="position: relative; padding: 54px 16px 0">
<a href="Main.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#2b1f1c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
</div>

<main style="position: relative; flex: 1 1 auto; box-sizing: border-box; padding: 24px 32px 40px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px">
<div aria-hidden="true" style="position: relative; width: 240px; height: 240px; margin-top: 8px">
<svg viewBox="0 0 240 240" width="240" height="240" style="position: absolute; left: 0; top: 0">
<sc-if value="{{showSegs}}" hint-placeholder-val="{{ true }}">
<sc-for list="{{segs}}" as="g" hint-placeholder-count="13"><path d="{{g.d}}" fill="none" stroke="{{g.c}}" stroke-width="14" stroke-linecap="round"/></sc-for>
</sc-if>
<sc-if value="{{showPulse}}" hint-placeholder-val="{{ false }}">
<circle cx="120" cy="120" r="108" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="14"/>
<circle cx="120" cy="120" r="108" fill="none" stroke="#fcca37" stroke-width="14" stroke-linecap="round" stroke-dasharray="120 560" transform="rotate(-90 120 120)"/>
</sc-if>
</svg>
<div style="position: absolute; left: 30px; top: 30px; width: 180px; height: 180px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(43,31,28,0.12)">
<svg viewBox="0 0 120 120" width="124" height="124">
<path d="M60 36 C46 28 28 28 16 32 L16 90 C28 86 46 86 60 94 Z" fill="#e0dff2"/>
<path d="M60 36 C74 28 92 28 104 32 L104 90 C92 86 74 86 60 94 Z" fill="#f9f9f9"/>
<path d="M60 36 L60 94" stroke="#bebcdb" stroke-width="3"/>
<path d="M14 92 C28 88 46 88 60 96 C74 88 92 88 106 92 L106 98 C92 94 74 94 60 102 C46 94 28 94 14 98 Z" fill="#a16959"/>
<circle cx="40" cy="18" r="9" fill="#ff6666"/><circle cx="62" cy="10" r="5" fill="#fcca37"/><circle cx="84" cy="20" r="6" fill="#a579dd"/>
<path d="M92 44 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#fcca37"/>
</svg>
</div>
</div>
<h1 style="margin: 8px 0 0; font-size: 32px; line-height: 38px; font-weight: 700">We're making your story</h1>
<p role="status" style="margin: 0; padding: 8px 16px; border-radius: 999px; background: #ffffff; font-size: 18px; line-height: 24px; font-weight: 700">{{progress}}</p>
<p style="margin: 8px 0 0; font-size: 18px; line-height: 26px">It takes a few minutes. You can leave: we'll tell you when it's ready.</p>
<a href="HomeMaking.dc.html" style="margin-top: auto; width: 100%; height: 56px; border-radius: 999px; background: #ffffff; color: #2b1f1c; font-size: 18px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Back to Home</a>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stage":{"editor":"enum","options":["writing","pictures"],"default":"pictures"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pics = (this.props.stage ?? 'pictures') === 'pictures';
    const done = 5;
    const segs = Array.from({ length: 13 }, (_, i) => {
      const gap = 0.09, a0 = -Math.PI / 2 + (i / 13) * 2 * Math.PI + gap, a1 = -Math.PI / 2 + ((i + 1) / 13) * 2 * Math.PI - gap, r = 108;
      const p = (a) => (120 + r * Math.cos(a)).toFixed(1) + ' ' + (120 + r * Math.sin(a)).toFixed(1);
      return { d: 'M ' + p(a0) + ' A ' + r + ' ' + r + ' 0 0 1 ' + p(a1), c: i < done ? '#fcca37' : 'rgba(255,255,255,0.45)' };
    });
    return {
      progress: pics ? 'Drawing the pictures: ' + done + ' of 13' : 'Writing the words…',
      showSegs: pics, showPulse: !pics, segs
    };
  }
}
</script>
</body>
</html>
