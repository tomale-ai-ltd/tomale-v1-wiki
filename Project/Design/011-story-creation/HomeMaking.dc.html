<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home with a story being made</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Bold.woff2") format("woff2");font-weight:700}
body{margin:0}
a{color:#1b7b7a}a:hover{color:#145e5d}
</style>
</helmet>
<div style="width: 390px; height: 1000px; position: relative; overflow: hidden; background: #f8f8f8; color: #2b1f1c; font-family: 'Glacial Indifference', 'Avenir Next', system-ui, sans-serif">

<header style="box-sizing: border-box; padding: 58px 16px 64px; background: #39c2c1; border-radius: 0 0 36px 36px; position: relative; overflow: hidden">
<svg viewBox="0 0 390 220" width="390" height="220" style="position: absolute; left: 0; top: 0" aria-hidden="true"><circle cx="330" cy="40" r="70" fill="#5fd0cf"/><circle cx="20" cy="200" r="40" fill="#5fd0cf"/><circle cx="250" cy="70" r="5" fill="#fcca37"/></svg>
<div style="position: relative; display: flex; align-items: center; gap: 14px">
<span style="width: 72px; height: 72px; border: 4px solid #ffffff; border-radius: 999px; overflow: hidden; display: block; flex: none; box-sizing: border-box"><dc-import name="Art" kind="{{avatar}}" hint-size="64px,64px"></dc-import></span>
<div>
<h1 style="margin: 0; font-size: 32px; line-height: 38px; font-weight: 700">Hello {{name}}</h1>
<p style="margin: 2px 0 0; font-size: 16px; line-height: 24px">What shall we make today?</p>
</div>
</div>
</header>

<main style="position: relative; margin-top: -40px; padding: 0 16px; display: flex; flex-direction: column; gap: 24px">
<sc-if value="{{showMaking}}" hint-placeholder-val="{{ true }}">
<a href="Making.dc.html" style="box-sizing: border-box; padding: 14px 16px; border-radius: 16px; background: #ffffff; box-shadow: 0 2px 8px rgba(43,31,28,0.08); display: flex; align-items: center; gap: 14px; text-decoration: none; color: #2b1f1c">
<span aria-hidden="true" style="width: 56px; height: 72px; border-radius: 10px; background: #d7f3f2; display: flex; align-items: center; justify-content: center; flex: none">
<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#1b7b7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
</span>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="align-self: flex-start; padding: 2px 10px; border-radius: 999px; background: #d7f3f2; font-size: 13px; line-height: 18px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase">Being made</span>
<span style="font-size: 16px; line-height: 22px; font-weight: 700">A story with Pip and Rosie</span>
<span style="font-size: 14px; line-height: 20px; color: #6e5c57">Drawing the pictures: 5 of 13</span>
</span>
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#6e5c57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
</a>
</sc-if>

<section aria-label="Quick actions" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<a href="Chat.dc.html" style="min-height: 112px; box-sizing: border-box; padding: 14px; border-radius: 20px; background: #ff6666; color: #2b1f1c; text-decoration: none; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 8px rgba(43,31,28,0.08)">
<span style="width: 44px; height: 44px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#2b1f1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M12 7v6M9 10h6"/></svg></span>
<span style="font-size: 20px; line-height: 24px; font-weight: 700">{{storyLabel}}</span>
</a>
<a href="#" style="min-height: 112px; box-sizing: border-box; padding: 14px; border-radius: 20px; background: #39c2c1; color: #2b1f1c; text-decoration: none; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 8px rgba(43,31,28,0.08)">
<span style="width: 44px; height: 44px; border-radius: 999px; overflow: hidden; background: #ffffff; display: block"><dc-import name="Art" kind="dragon" hint-size="44px,44px"></dc-import></span>
<span style="font-size: 20px; line-height: 24px; font-weight: 700">{{charLabel}}</span>
</a>
</section>

<section aria-labelledby="recent-h" style="display: flex; flex-direction: column; gap: 12px">
<h2 id="recent-h" style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 700">{{listTitle}}</h2>
<div style="background: #ffffff; border-radius: 16px; box-shadow: 0 2px 8px rgba(43,31,28,0.08); overflow: hidden">
<sc-if value="{{showReady}}" hint-placeholder-val="{{ false }}">
<a href="Cover.dc.html" style="min-height: 80px; box-sizing: border-box; padding: 12px 16px; display: flex; align-items: center; gap: 14px; text-decoration: none; color: #2b1f1c; border-bottom: 1px solid #f1ebe8">
<span style="width: 56px; height: 56px; border-radius: 10px; overflow: hidden; display: block; flex: none"><dc-import name="Art" kind="girl" hint-size="56px,56px"></dc-import></span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column"><span style="font-size: 18px; line-height: 24px; font-weight: 700">The Lost Star</span><span style="font-size: 14px; line-height: 20px; color: #6e5c57">Just now</span></span>
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#6e5c57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
</a>
</sc-if>
<sc-if value="{{showWaiting}}" hint-placeholder-val="{{ false }}">
<div style="min-height: 80px; box-sizing: border-box; margin: 8px; padding: 12px 14px; border-radius: 12px; border: 3px dashed #c9b9b3; display: flex; align-items: center; gap: 14px">
<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#6e5c57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
<span style="display: flex; flex-direction: column"><span style="font-size: 18px; line-height: 24px; font-weight: 700">The Lost Star</span><span style="font-size: 14px; line-height: 20px; color: #6e5c57">Waiting for a grown-up</span></span>
</div>
</sc-if>
<a href="#" style="min-height: 80px; box-sizing: border-box; padding: 12px 16px; display: flex; align-items: center; gap: 14px; text-decoration: none; color: #2b1f1c">
<span style="width: 56px; height: 56px; border-radius: 10px; overflow: hidden; display: block; flex: none"><dc-import name="Art" kind="robot" hint-size="56px,56px"></dc-import></span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column"><span style="font-size: 18px; line-height: 24px; font-weight: 700">The Robot Who Baked</span><span style="font-size: 14px; line-height: 20px; color: #6e5c57">Last week</span></span>
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#6e5c57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
</a>
</div>
</section>
</main>

<sc-if value="{{showToast}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 100px; box-sizing: border-box; padding: 12px 12px 12px 16px; border-radius: 16px; background: #2b1f1c; color: #ffffff; display: flex; align-items: center; gap: 10px; box-shadow: 0 -8px 24px rgba(43,31,28,0.12)">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#9fe0df" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 6 9 17l-5-5"/></svg>
<span style="flex: 1 1 auto; font-size: 16px; line-height: 22px; font-weight: 700">{{toastText}}</span>
<sc-if value="{{toastOpen}}" hint-placeholder-val="{{ true }}">
<a href="Cover.dc.html" style="height: 44px; padding: 0 16px; border-radius: 999px; background: #fcca37; color: #2b1f1c; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; flex: none">Open</a>
</sc-if>
</div>
</sc-if>

<nav aria-label="Tabs" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 8px 24px; background: #ffffff; border-top: 1px solid #f1ebe8; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); font-size: 12px; line-height: 16px; font-weight: 700; color: #6e5c57; text-align: center">
<span style="color: #2b1f1c">Home</span><span>Create</span><span>Bookshelf</span><span>Characters</span><span>Store</span>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"profile":{"editor":"enum","options":["parent","child"],"default":"parent"},"toast":{"editor":"enum","options":["none","ready","ready-held"],"default":"none"},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const child = (this.props.profile ?? 'parent') === 'child';
    const t = this.props.toast ?? 'none';
    const done = t !== 'none';
    const held = t === 'ready-held';
    return {
      name: child ? 'Mia' : 'Kyle', avatar: child ? 'girl' : 'bear',
      storyLabel: child ? 'Make a story' : 'New story', charLabel: child ? 'Make a character' : 'New character',
      listTitle: child ? 'My stories' : 'Recent stories',
      showMaking: !done,
      showReady: done && !(held && child), showWaiting: held && child,
      showToast: done,
      toastText: held && child ? 'Your story is made! A grown-up will look at it soon.' : 'Your story "The Lost Star" is ready',
      toastOpen: !(held && child)
    };
  }
}
</script>
</body>
</html>
