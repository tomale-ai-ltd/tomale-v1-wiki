<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Couldn't make the story</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Bold.woff2") format("woff2");font-weight:700}
body{margin:0}
a{color:#1b7b7a}a:hover{color:#145e5d}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f8f8f8; color: #2b1f1c; font-family: 'Glacial Indifference', 'Avenir Next', system-ui, sans-serif; display: flex; flex-direction: column">
<div style="padding: 54px 16px 0">
<a href="Main.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(43,31,28,0.08)">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#2b1f1c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
</div>
<main style="flex: 1 1 auto; box-sizing: border-box; padding: 40px 32px 40px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px">
<svg viewBox="0 0 120 120" width="160" height="160" aria-hidden="true">
<circle cx="60" cy="60" r="56" fill="#ffe0e0"/>
<path d="M60 40 C50 34 36 34 26 37 L26 84 C36 81 50 81 60 87 Z" fill="#e0dff2"/>
<path d="M60 40 C70 34 84 34 94 37 L94 84 C84 81 70 81 60 87 Z" fill="#f9f9f9"/>
<path d="M60 40 L60 87" stroke="#bebcdb" stroke-width="3"/>
<path d="M40 56 Q44 52 48 56 M72 56 Q76 52 80 56" stroke="#2b1f1c" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M50 70 Q60 64 70 70" stroke="#2b1f1c" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700">{{title}}</h1>
<p style="margin: 0; font-size: 18px; line-height: 26px">{{body}}</p>
<div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 12px">
<a href="Chat.dc.html" style="height: 56px; border-radius: 999px; background: #ff6666; color: #2b1f1c; font-size: 18px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">{{primary}}</a>
<sc-if value="{{isFailed}}" hint-placeholder-val="{{ false }}">
<a href="Main.dc.html" style="height: 52px; box-sizing: border-box; border-radius: 999px; border: 2px solid #8f7f7a; background: #ffffff; color: #2b1f1c; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Later</a>
</sc-if>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["blocked","failed"],"default":"blocked"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const failed = (this.props.kind ?? 'blocked') === 'failed';
    return {
      isFailed: failed,
      title: failed ? 'Something went wrong making your story' : 'We can’t make this story',
      body: failed ? 'Nothing is lost. Try again now, or find it later in the Story builder.' : 'Let’s try a different idea. Your characters, story kind and pictures are kept.',
      primary: failed ? 'Try again' : 'Try a different idea'
    };
  }
}
</script>
</body>
</html>
