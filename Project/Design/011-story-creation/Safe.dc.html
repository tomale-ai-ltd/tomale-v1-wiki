<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Something worrying</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Bold.woff2") format("woff2");font-weight:700}
body{margin:0}
a{color:#1b7b7a}a:hover{color:#145e5d}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f8f8f8; color: #2b1f1c; font-family: 'Glacial Indifference', 'Avenir Next', system-ui, sans-serif">
<div aria-hidden="true" style="height: 124px; background: #fcca37; border-radius: 0 0 32px 32px"></div>
<div aria-hidden="true" style="padding: 20px 16px; display: flex; flex-direction: column; gap: 16px">
<div style="height: 60px; border-radius: 18px; background: #ece7e5; width: 70%"></div>
<div style="height: 120px; border-radius: 16px; background: #ffffff"></div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(43,31,28,0.4)"></div>

<section role="alertdialog" aria-modal="true" aria-labelledby="safe-title" aria-describedby="safe-body" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 24px 40px; background: #ffffff; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 24px rgba(43,31,28,0.12); display: flex; flex-direction: column; gap: 16px">
<div aria-hidden="true" style="width: 36px; height: 4px; border-radius: 999px; background: #e6dedb; margin: 0 auto"></div>
<svg viewBox="0 0 120 120" width="88" height="88" aria-hidden="true" style="align-self: center"><circle cx="60" cy="60" r="56" fill="#d7f3f2"/><path d="M60 88 C40 74 30 62 30 50 C30 41 37 35 45 35 C52 35 57 39 60 45 C63 39 68 35 75 35 C83 35 90 41 90 50 C90 62 80 74 60 88 Z" fill="#39c2c1"/></svg>
<h2 id="safe-title" style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 700; text-align: center">{{title}}</h2>
<p id="safe-body" style="margin: 0; font-size: 18px; line-height: 26px; text-align: center">{{body}}</p>
<a href="tel:{{tel}}" style="height: 56px; border-radius: 999px; background: #1b7b7a; color: #ffffff; font-size: 18px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>{{callLabel}}</a>
<sc-if value="{{isChild}}" hint-placeholder-val="{{ true }}">
<a href="https://www.childline.org.uk" style="height: 48px; box-sizing: border-box; border-radius: 999px; border: 2px solid #1b7b7a; background: #ffffff; color: #145e5d; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">childline.org.uk</a>
</sc-if>
<button type="button" style="height: 48px; border-radius: 999px; border: 2px solid #8f7f7a; background: #ffffff; color: #2b1f1c; font: inherit; font-size: 17px; font-weight: 700">OK</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"profile":{"editor":"enum","options":["child","adult"],"default":"child"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const child = (this.props.profile ?? 'child') === 'child';
    return {
      isChild: child,
      title: child ? 'It sounds like something might be worrying you' : 'It sounds like things might be hard right now',
      body: child ? 'Talking to a grown-up you trust can really help. You can also talk to Childline. It’s free, and they’re there any time.' : 'You don’t have to deal with it alone. Samaritans are free to call, any time, day or night.',
      tel: child ? '08001111' : '116123',
      callLabel: child ? 'Call Childline: 0800 1111' : 'Call Samaritans: 116 123'
    };
  }
}
</script>
</body>
</html>
