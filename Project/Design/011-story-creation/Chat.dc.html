<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Story chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Bold.woff2") format("woff2");font-weight:700}
body{margin:0}
a{color:#1b7b7a}a:hover{color:#145e5d}
</style>
</helmet>
<div style="width: 390px; height: 1000px; position: relative; overflow: hidden; background: #f8f8f8; color: #2b1f1c; font-family: 'Glacial Indifference', 'Avenir Next', system-ui, sans-serif; display: flex; flex-direction: column">

<svg viewBox="0 0 390 1000" width="390" height="1000" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<g opacity="0.16">
<circle cx="40" cy="190" r="22" fill="#ff6666"/><circle cx="352" cy="260" r="9" fill="#a579dd"/><circle cx="320" cy="420" r="14" fill="#39c2c1"/>
<circle cx="26" cy="560" r="10" fill="#fcca37"/><circle cx="366" cy="700" r="20" fill="#ff6666"/><circle cx="60" cy="860" r="12" fill="#39c2c1"/>
<path d="M300 170 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z" fill="#fcca37"/><path d="M80 380 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#fcca37"/>
<path d="M340 560 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#fcca37"/><path d="M200 950 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z" fill="#fcca37"/>
<path d="M28 660 h10 M33 655 v10" stroke="#39c2c1" stroke-width="3" stroke-linecap="round"/><path d="M290 880 h10 M295 875 v10" stroke="#39c2c1" stroke-width="3" stroke-linecap="round"/>
</g>
</svg>

<header style="box-sizing: border-box; padding: 54px 16px 18px; background: #fcca37; border-radius: 0 0 32px 32px; position: relative; overflow: hidden; flex: none">
<svg viewBox="0 0 390 130" width="390" height="130" style="position: absolute; left: 0; top: 0" aria-hidden="true"><circle cx="340" cy="30" r="64" fill="#fdd65e"/><circle cx="260" cy="100" r="4" fill="#ff6666"/></svg>
<div style="position: relative; display: flex; align-items: center; gap: 12px">
<a href="Main.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center; flex: none">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#2b1f1c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700">New story</h1>
<span style="margin-left: auto; font-size: 14px; line-height: 20px; font-weight: 700">Step {{stepNo}} of 6</span>
</div>
</header>

<main aria-live="polite" style="position: relative; flex: 1 1 auto; box-sizing: border-box; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">

<sc-for list="{{history}}" as="h" hint-placeholder-count="2">
<div style="display: flex; gap: 8px; align-items: flex-end">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: #39c2c1; flex: none; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2z"/><path d="M22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/></svg></span>
<p style="margin: 0; max-width: 250px; box-sizing: border-box; padding: 10px 14px; border-radius: 18px 18px 18px 4px; background: #ece7e5; font-size: 16px; line-height: 22px">{{h.q}}</p>
</div>
<div style="display: flex; gap: 8px; align-items: flex-end; justify-content: flex-end">
<p style="margin: 0; max-width: 250px; box-sizing: border-box; padding: 10px 14px; border-radius: 18px 18px 4px 18px; background: #ff6666; color: #2b1f1c; font-size: 16px; line-height: 22px; font-weight: 700">{{h.a}}</p>
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; overflow: hidden; display: block; flex: none; border: 2px solid #ffffff; box-sizing: border-box"><dc-import name="Art" kind="{{me}}" hint-size="32px,32px"></dc-import></span>
</div>
</sc-for>

<div style="display: flex; gap: 8px; align-items: flex-end">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: #39c2c1; flex: none; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2z"/><path d="M22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/></svg></span>
<sc-if value="{{thinking}}" hint-placeholder-val="{{ false }}">
<p role="status" aria-label="Tomale is thinking" style="margin: 0; padding: 14px 18px; border-radius: 18px 18px 18px 4px; background: #ece7e5; display: flex; gap: 6px"><span style="width: 9px; height: 9px; border-radius: 999px; background: #8f7f7a; display: block"></span><span style="width: 9px; height: 9px; border-radius: 999px; background: #8f7f7a; opacity: 0.7; display: block"></span><span style="width: 9px; height: 9px; border-radius: 999px; background: #8f7f7a; opacity: 0.4; display: block"></span></p>
</sc-if>
<sc-if value="{{notThinking}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; max-width: 280px; box-sizing: border-box; padding: 12px 14px; border-radius: 18px 18px 18px 4px; background: #ece7e5; font-size: 18px; line-height: 24px; font-weight: 700">{{question}}</p>
</sc-if>
</div>

<sc-if value="{{isIdea}}" hint-placeholder-val="{{ true }}">
<sc-if value="{{showIdeas}}" hint-placeholder-val="{{ false }}">
<div role="group" aria-label="Ideas" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ideas}}" as="i" hint-placeholder-count="3">
<button type="button" style="box-sizing: border-box; padding: 12px 14px; border-radius: 16px; border: 2px solid #e6dedb; background: #ffffff; font: inherit; color: #2b1f1c; text-align: left; display: flex; flex-direction: column; gap: 2px; cursor: pointer">
<span style="font-size: 16px; line-height: 22px; font-weight: 700">{{i.title}}</span>
<span style="font-size: 15px; line-height: 21px; color: #6e5c57">{{i.idea}}</span>
</button>
</sc-for>
</div>
</sc-if>
<label for="idea" style="font-size: 14px; line-height: 20px; font-weight: 700">Your idea</label>
<textarea id="idea" rows="3" placeholder="A dragon who's scared of the dark…" style="box-sizing: border-box; width: 100%; padding: 12px 14px; border-radius: 16px; border: 2px solid #c9b9b3; background: #ffffff; font: inherit; font-size: 17px; line-height: 24px; color: #2b1f1c; resize: none">{{ideaText}}</textarea>
<div style="display: flex; justify-content: flex-end; font-size: 13px; line-height: 18px; color: #6e5c57"><span>{{count}} / 300</span></div>
<div style="display: flex; gap: 10px">
<button type="button" style="flex: 1 1 0; height: 48px; border-radius: 999px; border: 2px solid #8f7f7a; background: #ffffff; color: #2b1f1c; font: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#2b1f1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>{{ideaChip}}</button>
<button type="button" style="flex: 1 1 0; height: 48px; border-radius: 999px; border: 2px solid #a579dd; background: #f3ecfb; color: #2b1f1c; font: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#2b1f1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.8L20 10l-5 3.6L16.8 20 12 16.5 7.2 20 9 13.6 4 10l6.1-1.2z"/></svg>Surprise me</button>
</div>
<button type="button" style="height: 52px; border-radius: 999px; border: 0; background: #ff6666; color: #2b1f1c; font: inherit; font-size: 18px; font-weight: 700">Next</button>
</sc-if>

<sc-if value="{{isCharacters}}" hint-placeholder-val="{{ false }}">
<div role="group" aria-label="Characters" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{chars}}" as="c" hint-placeholder-count="5">
<button type="button" aria-pressed="{{c.on}}" style="{{c.style}}">
<sc-if value="{{c.isOn}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 999px; background: #1b7b7a; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></sc-if>
<span style="width: 68px; height: 68px; border-radius: 999px; overflow: hidden; display: block"><dc-import name="Art" kind="{{c.kind}}" hint-size="68px,68px"></dc-import></span>
<span style="font-size: 15px; line-height: 20px; font-weight: 700">{{c.name}}</span>
<sc-if value="{{c.fromIdea}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; line-height: 16px; font-weight: 700; color: #145e5d">From your idea</span></sc-if>
</button>
</sc-for>
<button type="button" style="min-height: 132px; box-sizing: border-box; padding: 10px 6px; border-radius: 16px; border: 3px dashed #c9b9b3; background: #ffffff; font: inherit; color: #2b1f1c; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer">
<svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#2b1f1c" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
<span style="font-size: 15px; line-height: 20px; font-weight: 700">Make a new character</span>
</button>
</div>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #6e5c57">Choose up to 3.</p>
<button type="button" style="height: 52px; border-radius: 999px; border: 0; background: #ff6666; color: #2b1f1c; font: inherit; font-size: 18px; font-weight: 700">These ones</button>
</sc-if>

<sc-if value="{{isTheme}}" hint-placeholder-val="{{ false }}">
<div role="group" aria-label="Kinds of story" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="6">
<button type="button" aria-pressed="{{t.on}}" style="{{t.style}}">
<sc-if value="{{t.suggested}}" hint-placeholder-val="{{ false }}"><span style="align-self: flex-start; padding: 2px 8px; border-radius: 999px; background: #1b7b7a; color: #ffffff; font-size: 12px; line-height: 16px; font-weight: 700">Suggested</span></sc-if>
<span style="font-size: 17px; line-height: 22px; font-weight: 700">{{t.name}}</span>
<span style="font-size: 14px; line-height: 19px; color: #6e5c57">{{t.line}}</span>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isStyle}}" hint-placeholder-val="{{ false }}">
<div role="group" aria-label="Picture styles" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{styles}}" as="s" hint-placeholder-count="4">
<button type="button" aria-pressed="{{s.on}}" style="{{s.style}}">
<span role="img" aria-label="Sample picture" style="{{s.swatch}}"></span>
<span style="font-size: 17px; line-height: 22px; font-weight: 700">{{s.name}}</span>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isPhonics}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0 0 0 40px; font-size: 15px; line-height: 21px; color: #6e5c57">The story will use words with these sounds, to practise reading together.</p>
<div role="group" aria-label="Practise some sounds" style="display: flex; gap: 10px">
<button type="button" style="flex: 1 1 0; height: 52px; border-radius: 999px; border: 2px solid #8f7f7a; background: #ffffff; color: #2b1f1c; font: inherit; font-size: 16px; font-weight: 700">Not this time</button>
<button type="button" aria-pressed="true" style="flex: 1 1 0; height: 52px; border-radius: 999px; border: 3px solid #1b7b7a; background: #d7f3f2; color: #2b1f1c; font: inherit; font-size: 16px; font-weight: 700">Yes, let's practise</button>
</div>
<sc-for list="{{phases}}" as="ph" hint-placeholder-count="2">
<p style="margin: 6px 0 0; font-size: 14px; line-height: 20px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6e5c57">{{ph.name}}</p>
<div role="group" aria-label="{{ph.name}} stages" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{ph.stages}}" as="p" hint-placeholder-count="2">
<button type="button" aria-pressed="{{p.on}}" style="{{p.style}}">
<span style="font-size: 16px; line-height: 21px; font-weight: 700">{{p.name}}</span>
<span style="font-size: 14px; line-height: 19px; color: #6e5c57">{{p.line}}</span>
</button>
</sc-for>
</div>
</sc-for>
</sc-if>

<sc-if value="{{isSummary}}" hint-placeholder-val="{{ false }}">
<section aria-label="Your story" style="background: #ffffff; border-radius: 20px; box-shadow: 0 2px 8px rgba(43,31,28,0.08); overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="min-height: 64px; box-sizing: border-box; padding: 10px 8px 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #f1ebe8">
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 13px; line-height: 18px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6e5c57">{{r.label}}</span>
<span style="font-size: 16px; line-height: 22px; font-weight: 700">{{r.value}}</span>
</span>
<button type="button" aria-label="Change {{r.label}}" style="height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: #f1ebe8; color: #2b1f1c; font: inherit; font-size: 15px; font-weight: 700; flex: none">Change</button>
</div>
</sc-for>
</section>
<sc-if value="{{isParent}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; font-size: 15px; line-height: 21px; color: #6e5c57; text-align: center">3 of 4 stories left this month</p>
</sc-if>
<a href="Making.dc.html" style="height: 56px; border-radius: 999px; background: #ff6666; color: #2b1f1c; font-size: 19px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 2px 8px rgba(43,31,28,0.12)">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#2b1f1c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.8L20 10l-5 3.6L16.8 20 12 16.5 7.2 20 9 13.6 4 10l6.1-1.2z"/></svg>Make my story</a>
</sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"enum","options":["idea","ideas","idea-refused","characters","theme","style","phonics","surprise-thinking","summary"],"default":"idea"},"profile":{"editor":"enum","options":["parent","child"],"default":"parent"},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.step ?? 'idea';
    const child = (this.props.profile ?? 'parent') === 'child';
    const card = (on, pad) => 'position: relative; box-sizing: border-box; padding: ' + pad + '; border-radius: 16px; border: 3px solid ' + (on ? '#1b7b7a' : '#e6dedb') + '; background: ' + (on ? '#d7f3f2' : '#ffffff') + '; font: inherit; color: #2b1f1c; text-align: left; display: flex; flex-direction: column; gap: 4px; cursor: pointer; min-height: 72px';
    const ccard = (on) => 'position: relative; min-height: 132px; box-sizing: border-box; padding: 10px 6px; border-radius: 16px; border: 3px solid ' + (on ? '#1b7b7a' : '#e6dedb') + '; background: ' + (on ? '#d7f3f2' : '#ffffff') + '; font: inherit; color: #2b1f1c; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer';
    const sw = (a, b) => 'height: 96px; border-radius: 10px; display: block; background: linear-gradient(135deg, ' + a + ', ' + b + ')';
    const Q = { idea: 'What happens in your story?', chars: 'Who’s in your story?', theme: 'What kind of story?', style: 'How should it look?', phon: 'Practise some sounds?' };
    const A = { idea: 'Pip the dragon and Rosie fly to the moon to find a lost star.', chars: 'Pip and Rosie', theme: 'Space adventure', style: 'Watercolour', phon: 'Phase 3 · Week 2' };
    const hist = {
      idea: [], ideas: [], 'surprise-thinking': [], 'idea-refused': [['refused']],
      characters: [['idea']], theme: [['idea'], ['chars']], style: [['chars'], ['theme']],
      phonics: [['theme'], ['style']], summary: [['phon']]
    };
    const history = (hist[s] || []).map(([k]) => (k === 'refused' ? { q: Q.idea, a: '[the idea they typed]' } : { q: Q[k], a: A[k] }));
    const qs = { idea: Q.idea, ideas: Q.idea, 'idea-refused': 'Hmm, I can\u2019t make a story about that. Let\u2019s try a different idea.', characters: 'Who’s in your story? I’ve ticked the ones from your idea.', theme: 'What kind of story? This one fits your idea.', style: Q.style, phonics: Q.phon, 'surprise-thinking': '', summary: 'Here’s your story!' };
    const no = { idea: '1', ideas: '1', 'idea-refused': '1', 'surprise-thinking': '1', characters: '2', theme: '3', style: '4', phonics: '5', summary: '6' };
    const chars = [['Pip', 'dragon', true, true], ['Rosie', 'girl', true, true], ['Bo', 'bear', false, false], ['Zip', 'robot', false, false], ['Red', 'fox', false, false]].map(([n, k, on, from]) => ({ name: n, kind: k, on: on ? 'true' : 'false', isOn: on, fromIdea: from, style: ccard(on) }));
    const themes = [['Space adventure', 'Rockets, stars and planets', true, true], ['Under the sea', 'Fish, shells and waves', false, false], ['Bedtime', 'Calm and cosy', false, false], ['Making friends', 'Being kind together', false, false], ['Dinosaurs', 'Long ago and very big', false, false], ['Fairy tale', 'Castles and magic', false, false]].map(([n, l, on, sug]) => ({ name: n, line: l, on: on ? 'true' : 'false', suggested: sug, style: card(on, '12px 14px') }));
    const styles = [['Watercolour', '#9fe0df', '#ffe0e0', true], ['Bright cartoon', '#fcca37', '#ff6666', false], ['Pencil sketch', '#e6dedb', '#8f7f7a', false], ['Storybook classic', '#a579dd', '#fff1c4', false]].map(([n, a, b, on]) => ({ name: n, swatch: sw(a, b), on: on ? 'true' : 'false', style: card(on, '8px 8px 12px') }));
    const st = (n, l, on) => ({ name: n, line: l, on: on ? 'true' : 'false', style: card(on, '12px 14px') });
    const phases = [
      { name: 'Phase 2', stages: [st('Week 1', 's, a, t, p', false), st('Week 2', 'i, n, m, d', false)] },
      { name: 'Phase 3', stages: [st('Week 1', 'ch, sh, th', false), st('Week 2', 'ai, ee, igh, oa', true)] }
    ];
    const idea = s === 'idea' ? A.idea : '';
    return {
      me: child ? 'girl' : 'bear',
      stepNo: no[s], question: qs[s], history,
      thinking: s === 'surprise-thinking', notThinking: s !== 'surprise-thinking',
      isIdea: s === 'idea' || s === 'ideas' || s === 'idea-refused' || s === 'surprise-thinking', showIdeas: s === 'ideas',
      isCharacters: s === 'characters', isTheme: s === 'theme', isStyle: s === 'style', isPhonics: s === 'phonics', isSummary: s === 'summary',
      isParent: !child,
      chars, themes, styles, phases, ideaText: idea, count: String(idea.length), ideaChip: s === 'ideas' ? 'More ideas' : 'Give me ideas',
      ideas: [
        { title: 'The Lost Star', idea: 'Pip and Rosie fly to the moon to find a star that fell out of the sky.' },
        { title: 'Moon Picnic', idea: 'Rosie packs a picnic and Pip flies them to the moon to share it with a lonely alien.' },
        { title: 'Bo’s Big Sneeze', idea: 'Bo the bear sneezes so hard he blows the clouds away, and the friends must bring the rain back.' }
      ],
      rows: [
        { label: 'Idea', value: A.idea },
        { label: 'Characters', value: 'Pip and Rosie' },
        { label: 'Kind of story', value: 'Space adventure' },
        { label: 'Pictures', value: 'Watercolour' },
        { label: 'Sounds', value: 'Phase 3 · Week 2' }
      ]
    };
  }
}
</script>
</body>
</html>
