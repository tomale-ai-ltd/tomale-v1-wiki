<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manage profiles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Bold.woff2") format("woff2");font-weight:700}
body{margin:0}
a{color:#1b7b7a}a:hover{color:#145e5d}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f8f8f8; color: #2b1f1c; font-family: 'Glacial Indifference', 'Avenir Next', system-ui, sans-serif">

<header style="height: 170px; box-sizing: border-box; padding: 54px 16px 0; background: #39c2c1; border-radius: 0 0 32px 32px; position: relative; overflow: hidden">
<svg viewBox="0 0 390 170" width="390" height="170" style="position: absolute; left: 0; top: 0" aria-hidden="true"><circle cx="340" cy="30" r="70" fill="#5fd0cf"/><circle cx="250" cy="120" r="5" fill="#fcca37"/><circle cx="300" cy="140" r="3" fill="#ffffff"/></svg>
<div style="position: relative; display: flex; align-items: center; gap: 12px">
<a href="Main.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center; flex: none">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#2b1f1c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<h1 style="margin: 0; font-size: 32px; line-height: 38px; font-weight: 700">Profiles</h1>
</div>
</header>

<main style="position: relative; margin-top: -40px; padding: 0 16px; display: flex; flex-direction: column; gap: 24px">
<section aria-label="Profiles" style="background: #ffffff; border-radius: 16px; box-shadow: 0 2px 8px rgba(43,31,28,0.08); overflow: hidden">
<sc-for list="{{profiles}}" as="p" hint-placeholder-count="3">
<a href="{{p.href}}" style="min-height: 80px; box-sizing: border-box; padding: 12px 16px; display: flex; align-items: center; gap: 14px; text-decoration: none; color: #2b1f1c; border-bottom: 1px solid #f1ebe8">
<span style="{{p.ring}}">
<sc-if value="{{p.isBear}}" hint-placeholder-val="{{ false }}"><dc-import name="Art" kind="bear" hint-size="56px,56px"></dc-import></sc-if>
<sc-if value="{{p.isGirl}}" hint-placeholder-val="{{ false }}"><dc-import name="Art" kind="girl" hint-size="56px,56px"></dc-import></sc-if>
<sc-if value="{{p.isFox}}" hint-placeholder-val="{{ false }}"><dc-import name="Art" kind="fox" hint-size="56px,56px"></dc-import></sc-if>
</span>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 20px; line-height: 26px; font-weight: 700">{{p.name}}</span>
<span style="font-size: 14px; line-height: 20px; color: #6e5c57">{{p.sub}}</span>
</span>
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#6e5c57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
</a>
</sc-for>
</section>

<div style="display: flex; flex-direction: column; gap: 8px">
<a href="EditProfile.dc.html" style="height: 48px; border-radius: 999px; background: #d63c3c; color: #ffffff; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
Add a child</a>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #6e5c57; text-align: center">2 of 6 children</p>
</div>

<section aria-labelledby="pin-h" style="display: flex; flex-direction: column; gap: 8px">
<h2 id="pin-h" style="margin: 0; font-size: 13px; line-height: 16px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6e5c57">Parent PIN</h2>
<a href="SetPin.dc.html" style="min-height: 64px; box-sizing: border-box; padding: 12px 16px; border-radius: 16px; background: #ffffff; box-shadow: 0 2px 8px rgba(43,31,28,0.08); display: flex; align-items: center; gap: 14px; text-decoration: none; color: #2b1f1c">
<span style="width: 40px; height: 40px; border-radius: 999px; background: #d7f3f2; display: flex; align-items: center; justify-content: center; flex: none">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#1b7b7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column">
<span style="font-size: 18px; line-height: 24px; font-weight: 700">Change PIN</span>
<span style="font-size: 14px; line-height: 20px; color: #6e5c57">Needed to open your profile from a child's</span>
</span>
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#6e5c57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
</a>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ring = (bg) => 'width: 56px; height: 56px; border-radius: 999px; overflow: hidden; display: block; flex: none; background: ' + bg;
    return {
      profiles: [
        { name: 'Kyle', sub: 'You · grown-up', href: 'EditProfile.dc.html', isBear: true, ring: ring('#f1e3dc') },
        { name: 'Mia', sub: 'Child', href: 'EditProfile.dc.html', isGirl: true, ring: ring('#ffe0e0') },
        { name: 'Leo', sub: 'Child', href: 'EditProfile.dc.html', isFox: true, ring: ring('#ffe3d1') }
      ]
    };
  }
}
</script>
</body>
</html>
