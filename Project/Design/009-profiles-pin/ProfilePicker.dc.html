<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Bold.woff2") format("woff2");font-weight:700}
body{margin:0}
a{color:#1b7b7a}a:hover{color:#145e5d}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #fff6dc; color: #2b1f1c; font-family: 'Glacial Indifference', 'Avenir Next', system-ui, sans-serif">
<svg viewBox="0 0 390 844" width="390" height="844" style="position: absolute; left: 0; top: 0" aria-hidden="true"><circle cx="360" cy="70" r="90" fill="#fdd862" opacity="0.6"/><circle cx="20" cy="800" r="80" fill="#d7f3f2"/><circle cx="60" cy="120" r="5" fill="#ff6666"/><circle cx="320" cy="760" r="6" fill="#39c2c1"/><path d="M300 200 l5 10 11 2 -8 8 2 11 -10 -5 -10 5 2 -11 -8 -8 11 -2 Z" fill="#ffffff"/></svg>

<main style="position: relative; box-sizing: border-box; height: 100%; padding: 96px 24px 40px; display: flex; flex-direction: column; gap: 36px">
<h1 style="margin: 0; font-size: 36px; line-height: 42px; font-weight: 700; text-align: center">Who's reading?</h1>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 16px">
<sc-for list="{{profiles}}" as="p" hint-placeholder-count="3">
<a href="{{p.href}}" aria-label="{{p.aria}}" style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-decoration: none; color: #2b1f1c">
<span style="position: relative; width: 132px; height: 132px; display: block">
<span style="{{p.ring}}">
<sc-if value="{{p.isBear}}" hint-placeholder-val="{{ false }}"><dc-import name="Art" kind="bear" hint-size="120px,120px"></dc-import></sc-if>
<sc-if value="{{p.isGirl}}" hint-placeholder-val="{{ false }}"><dc-import name="Art" kind="girl" hint-size="120px,120px"></dc-import></sc-if>
<sc-if value="{{p.isFox}}" hint-placeholder-val="{{ false }}"><dc-import name="Art" kind="fox" hint-size="120px,120px"></dc-import></sc-if>
</span>
<sc-if value="{{p.locked}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; right: 2px; bottom: 2px; width: 40px; height: 40px; border-radius: 999px; background: #2b1f1c; border: 3px solid #fff6dc; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
</span>
</sc-if>
</span>
<span style="font-size: 24px; line-height: 30px; font-weight: 700">{{p.name}}</span>
</a>
</sc-for>
</div>

<p style="margin: auto 0 0; font-size: 16px; line-height: 22px; text-align: center; color: #6e5c57">Grown-ups need their PIN to open their profile.</p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ring = (bg) => 'width: 132px; height: 132px; box-sizing: border-box; border-radius: 999px; overflow: hidden; display: block; border: 6px solid #ffffff; box-shadow: 0 2px 8px rgba(43,31,28,0.12); background: ' + bg;
    return {
      profiles: [
        { name: 'Kyle', aria: "Kyle's profile, needs PIN", href: 'PinPad.dc.html', isBear: true, locked: true, ring: ring('#f1e3dc') },
        { name: 'Mia', aria: "Mia's profile", href: '#', isGirl: true, locked: false, ring: ring('#ffe0e0') },
        { name: 'Leo', aria: "Leo's profile", href: '#', isFox: true, locked: false, ring: ring('#ffe3d1') }
      ]
    };
  }
}
</script>
</body>
</html>
