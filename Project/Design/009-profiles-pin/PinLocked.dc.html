<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PIN locked</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Bold.woff2") format("woff2");font-weight:700}
body{margin:0}
a{color:#1b7b7a}a:hover{color:#145e5d}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f8f8f8; color: #2b1f1c; font-family: 'Glacial Indifference', 'Avenir Next', system-ui, sans-serif">

<header style="height: 330px; box-sizing: border-box; padding: 54px 16px 0; background: #d7f3f2; border-radius: 0 0 36px 36px; position: relative; overflow: hidden">
<svg viewBox="0 0 390 330" width="390" height="330" style="position: absolute; left: 0; top: 0" aria-hidden="true"><circle cx="195" cy="190" r="120" fill="#bfeae9"/><circle cx="50" cy="90" r="5" fill="#ffffff"/><circle cx="340" cy="120" r="6" fill="#fcca37"/><circle cx="320" cy="60" r="3" fill="#ffffff"/></svg>
<a href="ProfilePicker.dc.html" aria-label="Back to profiles" style="position: relative; width: 48px; height: 48px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#2b1f1c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<div style="position: relative; display: flex; justify-content: center; margin-top: 6px">
<sc-if value="{{showLock}}" hint-placeholder-val="{{ true }}">
<svg viewBox="0 0 160 160" width="160" height="160" aria-hidden="true"><rect x="30" y="68" width="100" height="78" rx="18" fill="#fcca37" stroke="#2b1f1c" stroke-width="5"/><path d="M52 68 V50 a28 28 0 0 1 56 0 V68" fill="none" stroke="#2b1f1c" stroke-width="7" stroke-linecap="round"/><circle cx="80" cy="102" r="10" fill="#2b1f1c"/><path d="M80 108 V124" stroke="#2b1f1c" stroke-width="7" stroke-linecap="round"/></svg>
</sc-if>
<sc-if value="{{showMail}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 160 160" width="160" height="160" aria-hidden="true"><rect x="20" y="44" width="120" height="84" rx="14" fill="#ffffff" stroke="#2b1f1c" stroke-width="5"/><path d="M24 50 L80 94 L136 50" fill="none" stroke="#2b1f1c" stroke-width="5" stroke-linejoin="round"/><circle cx="128" cy="44" r="18" fill="#39c2c1" stroke="#2b1f1c" stroke-width="4"/><path d="M120 44 l6 6 10 -12" fill="none" stroke="#2b1f1c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
</sc-if>
</div>
</header>

<main style="padding: 28px 24px 40px; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-size: 32px; line-height: 38px; font-weight: 700; text-align: center">{{title}}</h1>
<p style="margin: 0; font-size: 18px; line-height: 26px; text-align: center">{{body}}</p>

<sc-if value="{{isLimited}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 10px; background: #fff1c4">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#2b1f1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
<p style="margin: 0; font-size: 16px; line-height: 22px"><strong>Just sent.</strong> We've just sent you a link. Try again in a minute if it hasn't arrived.</p>
</div>
</sc-if>

<sc-if value="{{showSend}}" hint-placeholder-val="{{ true }}">
<button type="button" style="height: 48px; border-radius: 999px; border: 0; background: #d63c3c; color: #ffffff; font: inherit; font-size: 16px; font-weight: 700; margin-top: 8px">Email me a link</button>
</sc-if>
<sc-if value="{{isSent}}" hint-placeholder-val="{{ false }}">
<button type="button" style="height: 48px; border-radius: 999px; border: 2px solid #8f7f7a; background: #ffffff; color: #2b1f1c; font: inherit; font-size: 16px; font-weight: 700; margin-top: 8px">Send it again</button>
</sc-if>
<a href="ProfilePicker.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Back to profiles</a>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["locked","forgot","sent","just-sent"],"default":"locked"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state ?? 'locked';
    const sent = s === 'sent';
    return {
      showLock: !sent, showMail: sent,
      isSent: sent, isLimited: s === 'just-sent', showSend: s !== 'sent',
      title: sent ? 'Check your email' : (s === 'forgot' ? 'Forgot your PIN?' : 'Your PIN is locked'),
      body: sent
        ? "We've sent a link to the email on this account. Open it on this phone, then choose a new PIN."
        : (s === 'forgot'
          ? "No problem. We'll email a link to the account's email address. Open it on this phone and choose a new PIN."
          : "There were too many wrong tries. We'll email a link to the account's email address so a grown-up can unlock it and choose a new PIN.")
    };
  }
}
</script>
</body>
</html>
