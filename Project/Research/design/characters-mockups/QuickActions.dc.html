<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Character quick actions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Bold.woff2") format("woff2");font-weight:700}
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f8f8f8; color: #2b1f1c; font-family: 'Glacial Indifference', 'Avenir Next', system-ui, sans-serif">
<div aria-hidden="true" style="height: 170px; background: #ff6666; border-radius: 0 0 32px 32px"></div>
<div aria-hidden="true" style="padding: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="height: 230px; border-radius: 16px; background: #ffffff"></div><div style="height: 230px; border-radius: 16px; background: #ffffff"></div>
<div style="height: 230px; border-radius: 16px; background: #ffffff"></div><div style="height: 230px; border-radius: 16px; background: #ffffff"></div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(43,31,28,0.4)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="qa-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 24px 40px; background: #ffffff; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 24px rgba(43,31,28,0.12); display: flex; flex-direction: column">
<div aria-hidden="true" style="width: 36px; height: 4px; border-radius: 999px; background: #e6dedb; margin: 0 auto 14px"></div>
<div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px">
<span style="width: 56px; height: 56px; border-radius: 999px; overflow: hidden; flex: none; display: block"><dc-import name="Art" kind="dragon" hint-size="56px,56px"></dc-import></span>
<h2 id="qa-title" style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 700">Pip</h2>
</div>
<ul style="list-style: none; margin: 0; padding: 0">
<li style="border-bottom: 1px solid #e6dedb"><button type="button" style="width: 100%; min-height: 56px; border: 0; background: transparent; padding: 0; font: inherit; font-size: 16px; color: #2b1f1c; display: flex; align-items: center; gap: 14px; text-align: left">
<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="#fcca37" stroke="#2b1f1c" stroke-width="1.6" stroke-linejoin="round"/></svg>Remove from favourites</button></li>
<li style="border-bottom: 1px solid #e6dedb"><button type="button" style="width: 100%; min-height: 56px; border: 0; background: transparent; padding: 0; font: inherit; font-size: 16px; color: #2b1f1c; display: flex; align-items: center; gap: 14px; text-align: left">
<img src="/_blob/6f885f744f4472a79b15545ebdbdd778" alt="" width="24" height="24" style="object-fit: contain">Create a story with Pip</button></li>
<li style="border-bottom: 1px solid #e6dedb"><a href="DrawAgain.dc.html" style="min-height: 56px; font-size: 16px; color: #2b1f1c; text-decoration: none; display: flex; align-items: center; gap: 14px">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#2b1f1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Draw Pip again</a></li>
<sc-if value="{{isParent}}" hint-placeholder-val="{{ true }}">
<li style="border-bottom: 1px solid #e6dedb"><button type="button" style="width: 100%; min-height: 64px; border: 0; background: transparent; padding: 6px 0; font: inherit; font-size: 16px; color: #2b1f1c; display: flex; align-items: center; gap: 14px; text-align: left">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#2b1f1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="5" rx="1"/><path d="M4 9v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/></svg>
<span style="display: flex; flex-direction: column"><span>Archive</span><span style="font-size: 14px; line-height: 18px; color: #6e5c57">Hides Pip from your children. You can bring Pip back.</span></span></button></li>
<li><a href="DeleteConfirm.dc.html" style="min-height: 56px; font-size: 16px; color: #b3261e; text-decoration: none; display: flex; align-items: center; gap: 14px">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>Delete character</a></li>
</sc-if>
</ul>
<button type="button" style="margin-top: 16px; height: 48px; border-radius: 999px; border: 2px solid #8f7f7a; background: #ffffff; font: inherit; font-size: 16px; font-weight: 700; color: #2b1f1c">Cancel</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"profile":{"editor":"enum","options":["parent","child"],"default":"parent"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { isParent: (this.props.profile ?? 'parent') === 'parent' };
  }
}
</script>
</body>
</html>
