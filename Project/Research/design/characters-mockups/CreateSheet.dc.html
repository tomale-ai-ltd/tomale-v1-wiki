<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Bold.woff2") format("woff2");font-weight:700}
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f8f8f8; color: #2b1f1c; font-family: 'Glacial Indifference', 'Avenir Next', system-ui, sans-serif">
<div aria-hidden="true" style="height: 236px; background: #39c2c1; border-radius: 0 0 36px 36px"></div>
<div aria-hidden="true" style="padding: 16px; display: flex; flex-direction: column; gap: 12px"><div style="height: 160px; border-radius: 16px; background: #ffffff"></div><div style="height: 220px; border-radius: 16px; background: #ffffff"></div></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(43,31,28,0.4)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="cs-title" style="position: absolute; left: 0; right: 0; bottom: 98px; box-sizing: border-box; padding: 10px 20px 24px; background: #ffffff; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 24px rgba(43,31,28,0.12); display: flex; flex-direction: column; gap: 16px">
<div aria-hidden="true" style="width: 36px; height: 4px; border-radius: 999px; background: #e6dedb; margin: 0 auto"></div>
<h2 id="cs-title" style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 700">What shall we make?</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button type="button" style="{{storyStyle}}">
<span style="width: 76px; height: 76px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center"><img src="/_blob/6f885f744f4472a79b15545ebdbdd778" alt="" width="54" height="54" style="object-fit: contain"></span>
<span style="font-size: 22px; line-height: 26px; font-weight: 700">Make a story</span>
<sc-if value="{{storySoon}}" hint-placeholder-val="{{ true }}">
<span style="padding: 2px 10px; border-radius: 999px; background: #ffffff; font-size: 14px; line-height: 20px; font-weight: 700">Coming soon</span>
</sc-if>
</button>
<a href="CreateCharacter.dc.html" style="min-height: 190px; box-sizing: border-box; padding: 16px 12px; border-radius: 24px; background: #39c2c1; color: #2b1f1c; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center">
<span style="width: 76px; height: 76px; border-radius: 999px; overflow: hidden; background: #ffffff; display: block"><dc-import name="Art" kind="dragon" hint-size="76px,76px"></dc-import></span>
<span style="font-size: 22px; line-height: 26px; font-weight: 700">Make a character</span>
</a>
</div>
<sc-if value="{{storySoon}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; font-size: 16px; line-height: 22px; color: #6e5c57; text-align: center">Story making is on its way. Make your characters ready for it.</p>
</sc-if>
</section>

<div style="position: absolute; left: 0; right: 0; bottom: 0">
<dc-import name="TabBar" profile="parent" selected="create" hint-size="100%,98px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"storyAvailable":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const live = this.props.storyAvailable ?? false;
    return {
      storySoon: !live,
      storyStyle: 'min-height: 190px; box-sizing: border-box; padding: 16px 12px; border: 0; border-radius: 24px; background: #ff6666; color: #2b1f1c; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; opacity: ' + (live ? '1' : '0.75')
    };
  }
}
</script>
</body>
</html>
