<html lang="en">

</sc-if>

<sc-if value="{{isPending}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 200 200" style="width: 100%; height: 100%; display: block" aria-hidden="true">
<rect width="200" height="200" fill="#f1ebe8"/>
<circle cx="100" cy="96" r="52" fill="none" stroke="#c9b9b3" stroke-width="5" stroke-dasharray="10 10"/>
<path d="M118 66 L134 82 L92 124 L72 130 L78 110 Z" fill="#fcca37" stroke="#2b1f1c" stroke-width="4" stroke-linejoin="round"/>
<path d="M118 66 L134 82" stroke="#2b1f1c" stroke-width="4"/>
<path d="M72 130 L78 110 L92 124 Z" fill="#ffd6c2" stroke="#2b1f1c" stroke-width="4" stroke-linejoin="round"/>
<circle cx="64" cy="160" r="5" fill="#c9b9b3"/><circle cx="84" cy="160" r="5" fill="#c9b9b3"/><circle cx="104" cy="160" r="5" fill="#c9b9b3"/>
</svg>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["dragon","fox","robot","girl","bear","pending"],"default":"dragon"},"$preview":{"width":200,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'dragon';
    return {
      isDragon: k === 'dragon', isFox: k === 'fox', isRobot: k === 'robot',
      isGirl: k === 'girl', isBear: k === 'bear', isPending: k === 'pending'
    };
  }
}
</script>
</body>
</html>
