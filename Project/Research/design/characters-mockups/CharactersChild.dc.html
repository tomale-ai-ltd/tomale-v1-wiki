<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Characters, child profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Bold.woff2") format("woff2");font-weight:700}
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #d7f3f2; color: #2b1f1c; font-family: 'Glacial Indifference', 'Avenir Next', system-ui, sans-serif">
<svg viewBox="0 0 390 844" width="390" height="844" style="position: absolute; left: 0; top: 0" aria-hidden="true"><circle cx="350" cy="90" r="90" fill="#bfe9e8"/><circle cx="30" cy="560" r="70" fill="#bfe9e8"/><circle cx="90" cy="130" r="6" fill="#fcca37"/><circle cx="310" cy="610" r="5" fill="#ff6666"/></svg>

<h1 style="position: absolute; left: 16px; top: 54px; margin: 0; font-size: 32px; line-height: 38px; font-weight: 700">My characters</h1>

<div aria-hidden="true" style="position: absolute; left: -175px; top: 150px; width: 210px; height: 360px; border-radius: 28px; overflow: hidden; opacity: 0.85">
<div style="position: absolute; left: 0; top: 0; width: 300px; height: 360px"><dc-import name="Art" kind="fox" hint-size="300px,360px"></dc-import></div>
</div>
<button type="button" onClick="{{toggle}}" aria-expanded="{{expanded}}" aria-label="Pip. Tap to see more" style="position: absolute; left: 50px; top: 116px; width: 290px; height: 420px; padding: 0; border-radius: 32px; overflow: hidden; border: 7px solid #ffffff; box-shadow: 0 16px 36px rgba(43,31,28,0.2); background: #d7f3f2; cursor: pointer; display: block">
<span style="position: absolute; left: -50px; top: 0; width: 390px; height: 420px; display: block"><dc-import name="Art" kind="dragon" hint-size="390px,420px"></dc-import></span>
<span style="position: absolute; top: 14px; right: 14px; width: 52px; height: 52px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="30" height="30" role="img" aria-label="Favourite"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="#fcca37" stroke="#2b1f1c" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
</button>
<div aria-hidden="true" style="position: absolute; left: 355px; top: 150px; width: 210px; height: 360px; border-radius: 28px; overflow: hidden; opacity: 0.85">
<div style="position: absolute; left: -90px; top: 0; width: 300px; height: 360px"><dc-import name="Art" kind="robot" hint-size="300px,360px"></dc-import></div>
</div>

<sc-if value="{{collapsed}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 0; right: 0; top: 556px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px">
<h2 style="margin: 0; font-size: 36px; line-height: 42px; font-weight: 700">Pip</h2>
<p style="margin: 0; font-size: 18px; line-height: 24px">In 2 of your stories</p>
<p style="margin: 8px 0 0; font-size: 16px; line-height: 22px; color: #6e5c57">Swipe to meet the others. Tap Pip to play.</p>
</div>
</sc-if>

<sc-if value="{{revealed}}" hint-placeholder-val="{{ false }}">
<section aria-label="Pip" style="position: absolute; left: 0; right: 0; bottom: 98px; box-sizing: border-box; padding: 18px 16px 18px; background: #ffffff; border-radius: 28px 28px 0 0; box-shadow: 0 -8px 24px rgba(43,31,28,0.12); display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 36px; line-height: 42px; font-weight: 700">Pip</h2>
<button type="button" onClick="{{toggle}}" aria-label="Close" style="width: 48px; height: 48px; border: 0; border-radius: 999px; background: #f1ebe8; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#2b1f1c" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<a href="#" style="min-height: 96px; border-radius: 20px; background: #fcca37; color: #2b1f1c; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center"><img src="/_blob/6f885f744f4472a79b15545ebdbdd778" alt="" width="40" height="40" style="object-fit: contain">Make a story</a>
<button type="button" aria-pressed="true" style="min-height: 96px; border: 0; border-radius: 20px; background: #ffe0e0; color: #2b1f1c; font: inherit; font-size: 16px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg viewBox="0 0 24 24" width="38" height="38" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="#fcca37" stroke="#2b1f1c" stroke-width="1.6" stroke-linejoin="round"/></svg>Favourite</button>
<a href="DrawAgain.dc.html" style="min-height: 96px; border-radius: 20px; background: #d7f3f2; color: #2b1f1c; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#2b1f1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Draw again</a>
</div>
<div style="display: flex; gap: 10px">
<sc-for list="{{stories}}" as="s" hint-placeholder-count="2">
<a href="#" style="flex: 1 1 0; min-width: 0; color: #2b1f1c; text-decoration: none; display: flex; flex-direction: column; gap: 4px">
<span style="aspect-ratio: 3 / 2; border-radius: 14px; overflow: hidden; display: block"><dc-import name="Art" kind="{{s.kind}}" hint-size="100%,100%"></dc-import></span>
<span style="font-size: 16px; line-height: 20px; font-weight: 700">{{s.title}}</span>
</a>
</sc-for>
</div>
</section>
</sc-if>

<div style="position: absolute; left: 0; right: 0; bottom: 0">
<dc-import name="TabBar" profile="child" selected="characters" hint-size="100%,98px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startRevealed":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const open = this.state && this.state.open != null ? this.state.open : (this.props.startRevealed ?? false);
    return {
      revealed: open, collapsed: !open, expanded: open ? 'true' : 'false',
      toggle: () => this.setState({ open: !open }),
      stories: [
        { title: 'Pip and the Moon Kite', kind: 'dragon' },
        { title: 'Pip Learns to Share', kind: 'bear' }
      ]
    };
  }
}
</script>
</body>
</html>
