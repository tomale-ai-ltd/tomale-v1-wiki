<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Characters, parent profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Glacial Indifference";src:url("ds/tomale/fonts/GlacialIndifference-Bold.woff2") format("woff2");font-weight:700}
body{margin:0}
a{color:#1b7b7a}a:hover{color:#145e5d}
</style>
</helmet>
<div style="width: 390px; height: 1120px; position: relative; overflow: hidden; background: #f8f8f8; color: #2b1f1c; font-family: 'Glacial Indifference', 'Avenir Next', system-ui, sans-serif">

<header style="box-sizing: border-box; padding: 58px 16px 24px; background: #ff6666; border-radius: 0 0 32px 32px; position: relative; overflow: hidden">
<svg viewBox="0 0 390 170" width="390" height="170" style="position: absolute; left: 0; top: 0" aria-hidden="true"><circle cx="350" cy="20" r="70" fill="#ff8080"/><circle cx="200" cy="40" r="4" fill="#ffffff"/><circle cx="230" cy="70" r="3" fill="#fcca37"/></svg>
<div style="position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
<div>
<h1 style="margin: 0; font-size: 32px; line-height: 38px; font-weight: 700">Characters</h1>
<p style="margin: 2px 0 0; font-size: 16px; line-height: 24px">8 characters in your family</p>
</div>
<div style="display: flex; gap: 8px; align-items: center">
<a href="CarouselParallax.dc.html" aria-label="Show as cards" style="width: 48px; height: 48px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center; flex: none"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#2b1f1c" stroke-width="2" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 6v12M21 6v12"/></svg></a>
<a href="CreateCharacter.dc.html" style="height: 48px; padding: 0 18px; border-radius: 999px; background: #fcca37; color: #2b1f1c; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 6px; white-space: nowrap; box-shadow: 0 2px 8px rgba(43,31,28,0.15)">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#2b1f1c" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New</a>
</div>
</div>
</header>

<div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px">
<label style="display: flex; align-items: center; gap: 8px; height: 48px; box-sizing: border-box; padding: 0 12px; background: #ffffff; border: 2px solid #8f7f7a; border-radius: 10px">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#6e5c57" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search characters</span>
<input type="search" placeholder="Search by name" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 16px; color: #2b1f1c; background: transparent">
</label>
<div role="group" aria-label="Show" style="display: flex; gap: 8px">
<button type="button" aria-pressed="true" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 2px solid #2b1f1c; background: #2b1f1c; color: #ffffff; font: inherit; font-size: 16px; font-weight: 700">All</button>
<button type="button" aria-pressed="false" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 2px solid #8f7f7a; background: #ffffff; color: #2b1f1c; font: inherit; font-size: 16px; display: flex; align-items: center; gap: 6px"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="#fcca37" stroke="#2b1f1c" stroke-width="1.5" stroke-linejoin="round"/></svg>Favourites</button>
<button type="button" aria-pressed="false" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 2px solid #8f7f7a; background: #ffffff; color: #2b1f1c; font: inherit; font-size: 16px">Archived</button>
</div>
</div>

<ul style="list-style: none; margin: 0; padding: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{chars}}" as="c" hint-placeholder-count="6">
<li style="position: relative; background: #ffffff; border-radius: 16px; box-shadow: 0 2px 8px rgba(43,31,28,0.08); padding: 10px; display: flex; flex-direction: column; gap: 6px">
<a href="CharacterDetail.dc.html" style="display: flex; flex-direction: column; gap: 6px; color: #2b1f1c; text-decoration: none">
<span style="aspect-ratio: 1 / 1; border-radius: 10px; overflow: hidden; display: block"><dc-import name="Art" kind="{{c.kind}}" hint-size="100%,100%"></dc-import></span>
<span style="font-size: 20px; line-height: 26px; font-weight: 700">{{c.name}}</span>
<span style="font-size: 14px; line-height: 18px; color: #6e5c57">{{c.meta}}</span>
</a>
<button type="button" aria-label="{{c.favLabel}}" aria-pressed="{{c.favPressed}}" style="position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border: 0; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(43,31,28,0.15)">
<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="{{c.starFill}}" stroke="#2b1f1c" stroke-width="1.6" stroke-linejoin="round"/></svg>
</button>
<a href="QuickActions.dc.html" aria-label="{{c.moreLabel}}" style="position: absolute; right: 6px; bottom: 6px; width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="24" height="24" fill="#2b1f1c" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
</a>
</li>
</sc-for>
</ul>

<div style="position: absolute; left: 0; right: 0; bottom: 0">
<dc-import name="TabBar" profile="parent" selected="characters" hint-size="100%,98px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { name: 'Pip', kind: 'dragon', meta: 'In 3 stories', fav: true },
      { name: 'Rosie', kind: 'fox', meta: 'In 2 stories', fav: true },
      { name: 'Bolt', kind: 'robot', meta: 'In 1 story', fav: true },
      { name: 'Ava', kind: 'girl', meta: 'In 4 stories', fav: false },
      { name: 'Barnaby', kind: 'bear', meta: 'Not in a story yet', fav: false },
      { name: 'Luna', kind: 'pending', meta: 'Drawing Luna…', fav: false }
    ];
    return {
      chars: raw.map((c) => ({
        ...c,
        starFill: c.fav ? '#fcca37' : '#ffffff',
        favPressed: c.fav ? 'true' : 'false',
        favLabel: c.fav ? 'Remove ' + c.name + ' from favourites' : 'Add ' + c.name + ' to favourites',
        moreLabel: 'More for ' + c.name
      }))
    };
  }
}
</script>
</body>
</html>
